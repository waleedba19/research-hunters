name: Diagnostic - Full System Check

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup system deps + Ollama
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready after ${i}s"
              break
            fi
            sleep 1
          done
          ollama pull qwen2.5vl:3b
          ollama list

      - name: Install deps
        run: pip install --no-cache-dir --break-system-packages -r requirements.txt

      - name: "🔍 DIAGNOSTIC: Check Secrets & Tokens"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║         CHECKING SECRETS & TOKEN CONFIGURATION                ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          echo "1. GitHub Actions Secrets:"
          echo "   TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:+SET (hidden)}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "   ℹ️  NOT SET (optional) — Telegram push from gha_run_hunt.py disabled; hunts still run."
          else
            echo "   ✅ SET"
          fi
          echo "   GOOGLE_OAUTH_REFRESH: ${GOOGLE_OAUTH_REFRESH:+SET (hidden)}"
          if [ -z "$GOOGLE_OAUTH_REFRESH" ]; then
            echo "   ⚠️  NOT SET - Google Drive/Sheets upload will be skipped"
          else
            echo "   ✅ SET"
          fi
          echo "   GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:+SET (hidden)}"
          echo "   GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:+SET (hidden)}"
          echo
          echo "Note: The core hunt + verify pipeline runs with NO secrets. Telegram and"
          echo "Google Drive/Sheets are optional transports layered on top when configured."

      - name: "🔍 DIAGNOSTIC: Test Ollama & AI"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    TESTING OLLAMA & AI                         ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo

          python3 << 'PYEOF'
          import os
          os.environ['OLLAMA_HOST'] = 'http://127.0.0.1:11434'

          from precision_engine import _call_ollama

          print("Testing Ollama connection...")

          try:
              result = _call_ollama("Respond with exactly: HELLO WORLD", timeout=30)
              if "HELLO" in result.upper():
                  print("✅ Ollama working!")
                  print(f"   Response: {result[:100]}")
              else:
                  print(f"⚠️  Ollama responded but unexpected: {result[:100]}")
          except Exception as e:
              print(f"❌ Ollama failed: {e}")

          print()
          print("Testing precision engine...")
          try:
              from precision_engine import precision_search
              results = precision_search("machine learning", threshold=0.7)
              print(f"✅ Precision search returned {len(results)} results")
          except Exception as e:
              print(f"⚠️  Precision search issue: {e}")

          PYEOF

      - name: "🔍 DIAGNOSTIC: Test Modules"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  TESTING ALL MODULES                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo

          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')

          modules = [
              ("research_hunter_v4", "Main v4 wrapper (re-exports v2-4 surface)"),
              ("research_hunter_v2_4", "v2-4 shim (81 platforms)"),
              ("precision_engine", "Precision Engine"),
              ("platform_registry", "Platform Registry"),
              ("wizard", "Wizard (input state machine)"),
              ("hunt_intake", "Hunt Intake (14-step state machine)"),
              ("hunt_pipeline", "Hunt Pipeline"),
              ("state_manager", "State Manager"),
              ("pdf_parser", "PDF Parser"),
              ("metadata_extractor", "Metadata Extractor"),
              ("google_integration", "Google Integration"),
              ("future_studies", "Future Studies (v6.5)"),
              ("report_pdf", "Report PDF"),
              ("chapter_writer", "Chapter Writer (v0.2 stub)"),
              ("verify_refs.orchestrator", "verify_refs orchestrator"),
              ("verify_refs.reports", "verify_refs reports"),
          ]

          results = []
          for module_name, display_name in modules:
              try:
                  __import__(module_name)
                  print(f"✅ {display_name}")
                  results.append(True)
              except Exception as e:
                  print(f"❌ {display_name}: {e}")
                  results.append(False)

          print()
          if all(results):
              print("🎉 ALL MODULES WORKING!")
          else:
              print(f"⚠️  {sum(results)}/{len(results)} modules working")

          PYEOF

      - name: "🔍 DIAGNOSTIC: Test Google Integration"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║             TESTING GOOGLE INTEGRATION STATUS                 ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo

          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')

          try:
              import google_integration as gdrive
              status = gdrive.get_credential_status()
              print(f"✅ google_integration imported")
              print(f"   Credential status: {status}")
              # Check the public API surface is intact
              for fn in ("create_drive_folder", "upload_to_drive", "upload_results_to_drive",
                         "upload_hunt_to_drive", "create_doi_sheet", "list_files_in_folder"):
                  has = hasattr(gdrive, fn)
                  print(f"   {'✅' if has else '❌'} {fn}")
          except Exception as e:
              print(f"❌ google_integration failed: {e}")

          PYEOF

      - name: "🔍 DIAGNOSTIC: Platform Count"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                 CHECKING SEARCH PLATFORMS                     ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo

          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')

          try:
              import research_hunter_v2_4 as v2_4
              plats = list(v2_4.PLATFORM_FNS.keys())
              print(f"✅ {len(plats)} platforms registered (min expected: 75)")
              for p in plats[:10]:
                  print(f"   - {p}")
              if len(plats) > 10:
                  print(f"   ... and {len(plats)-10} more")
          except Exception as e:
              print(f"❌ Platform registry failed: {e}")

          PYEOF

      - name: "📋 SUMMARY"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    DIAGNOSTIC COMPLETE                        ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          echo "Core pipeline (hunt + verify + 81 platforms) needs NO secrets."
          echo
          echo "Optional transports (enable for full functionality):"
          echo "  - GOOGLE_OAUTH_REFRESH / GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET"
          echo "    → enables Drive folder creation + Sheets DOI export + ZIP upload"
          echo "  - TELEGRAM_BOT_TOKEN + CHAT_ID (per-run)"
          echo "    → enables Telegram push of hunt progress + results from gha_run_hunt.py"
          echo
          echo "Run ci.yml for fast offline checks; test.yml for the full ollama/online suite."

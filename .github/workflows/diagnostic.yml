name: Diagnostic - Full System Check

# Diagnoses the core research engine (v2-4, hunt_pipeline, verify_refs,
# precision_engine, ollama). The Telegram bot / Google Drive layer was
# removed from this repo; see AGENTS.md for the active module list.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup system deps + Ollama
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama ready after ${i}s"
              break
            fi
            sleep 1
          done
          ollama pull qwen2.5vl:3b
          ollama list

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: "🔍 DIAGNOSTIC: Check Secrets & Tokens"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH }}
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║         CHECKING SECRETS & TOKEN CONFIGURATION                ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          echo "1. GitHub Actions Secrets (optional — only needed for Telegram/Drive):"
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "   TELEGRAM_BOT_TOKEN: NOT SET (Telegram layer removed — OK)"
          else
            echo "   TELEGRAM_BOT_TOKEN: SET (hidden)"
          fi
          if [ -z "$GOOGLE_OAUTH_REFRESH" ]; then
            echo "   GOOGLE_OAUTH_REFRESH: NOT SET (Drive layer removed — OK)"
          else
            echo "   GOOGLE_OAUTH_REFRESH: SET (hidden)"
          fi
          echo
          echo "2. Core engine needs NO secrets — it runs standalone."

      - name: "🔍 DIAGNOSTIC: Test Ollama & AI"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    TESTING OLLAMA & AI                         ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          python3 << 'PYEOF'
          import os
          os.environ['OLLAMA_HOST'] = 'http://127.0.0.1:11434'

          from precision_engine import _call_ollama

          print("Testing Ollama connection...")
          try:
              result = _call_ollama("Respond with exactly: HELLO WORLD", timeout=30)
              if "HELLO" in result.upper():
                  print("✅ Ollama working!")
                  print(f"   Response: {result[:100]}")
              else:
                  print(f"⚠️  Ollama responded but unexpected: {result[:100]}")
          except Exception as e:
              print(f"❌ Ollama failed: {e}")

          print()
          print("Testing precision engine...")
          try:
              from precision_engine import precision_search
              results = precision_search("machine learning", threshold=0.7)
              print(f"✅ Precision search returned {len(results)} results")
          except Exception as e:
              print(f"⚠️  Precision search issue: {e}")
          PYEOF

      - name: "🔍 DIAGNOSTIC: Test Core Modules"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                  TESTING ALL MODULES                          ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')

          modules = [
              ("research_hunter_v2_4", "v2-4 Engine (70+ platforms)"),
              ("hunt_pipeline", "Hunt Pipeline"),
              ("precision_engine", "Precision Engine"),
              ("platform_registry", "Platform Registry"),
              ("state_manager", "State Manager"),
              ("pdf_parser", "PDF Parser"),
              ("metadata_extractor", "Metadata Extractor"),
              ("verify_refs", "Verify Refs Package"),
              ("future_studies", "Future Studies"),
              ("scoring_prompts", "Scoring Prompts"),
              ("search_cache", "Search Cache"),
          ]

          results = []
          for module_name, display_name in modules:
              try:
                  mod = __import__(module_name)
                  funcs = [f for f in dir(mod) if not f.startswith('_')][:5]
                  print(f"✅ {display_name}: {len(funcs)} public symbols")
                  results.append(True)
              except Exception as e:
                  print(f"❌ {display_name}: {e}")
                  results.append(False)

          print()
          if all(results):
              print("🎉 ALL CORE MODULES WORKING!")
          else:
              print(f"⚠️  {sum(results)}/{len(results)} modules working")
          PYEOF

      - name: "🔍 DIAGNOSTIC: Platform Count"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                 SEARCH PLATFORM INVENTORY                     ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')
          from platform_registry import get_all_platform_names
          names = get_all_platform_names()
          print(f"✅ {len(names)} search platforms registered")
          for n in names[:10]:
              print(f"   - {n}")
          if len(names) > 10:
              print(f"   ... and {len(names) - 10} more")
          PYEOF

      - name: "📋 SUMMARY"
        run: |
          echo
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║                    DIAGNOSTIC COMPLETE                        ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo
          echo "The core research engine runs standalone (no secrets required)."
          echo "Use the 'Research Hunter' workflow (research.yml) to run hunts."
          echo "Use the 'Test' workflow (test.yml) for the full test suite."
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Ollama models (shared between jobs)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5vl-3b
      - name: Setup Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if [ "${{ steps.cache-ollama.outputs.cache-hit }}" != "true" ]; then
            ollama pull qwen2.5vl:3b
          else
            echo "Model restored from cache"
          fi
      - name: Test model inference
        run: |
          ollama run qwen2.5vl:3b "hello" 2>&1 | head -5
          echo "Ollama READY"
      - name: Restore proof memory (cross-run learning persistence)
        uses: actions/cache@v4
        with:
          path: scripts/proof_memory.db
          key: proof-memory-${{ github.run_id }}
          restore-keys: proof-memory-
      - name: Install Python dependencies
        run: pip install -q requests rich openpyxl python-docx python-pptx pdfplumber pymupdf pytesseract reportlab playwright pillow ollama
      - name: Run full stack verification
        run: python scripts/verify.py --model qwen2.5vl:3b --ci || echo "Verify had some failures (non-critical)"

  # ═══════════════════════════════════════════════════════════════════════════
  # PLAN — computes the sub-hunt matrix so the research job can run each
  # research question / aspect as its OWN parallel "research box". With 2
  # research questions you get 2 parallel research jobs; with no RQs you get a
  # single job (back-compat with the old single-hunt path). When continue_label
  # is set (by a leg's own auto-trigger) the matrix is a single leg resuming
  # just that sub-topic, so completed legs are never re-run.
  # ═══════════════════════════════════════════════════════════════════════════
  plan:
    needs: [verify]
    if: always() && github.event_name == 'workflow_dispatch' && (contains(github.event.inputs.operation_mode, 'research-only') || contains(github.event.inputs.operation_mode, 'full-research') || contains(github.event.inputs.operation_mode, 'generate-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      folder_name: ${{ steps.folder.outputs.folder_name }}
      leg_count: ${{ steps.build.outputs.leg_count }}
      continue_label: ${{ steps.build.outputs.continue_label }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine output folder (deterministic name from title)
        id: folder
        shell: bash
        run: |
          TITLE="${{ github.event.inputs.title }}"
          SAFE=$(echo "$TITLE" | sed 's/[^a-zA-Z0-9_\-]/_/g' | sed 's/__*/_/g' | cut -c1-50)
          echo "folder_name=RESEARCH_${SAFE}" >> "$GITHUB_OUTPUT"
          echo "Using folder: RESEARCH_${SAFE}"
      - name: Build sub-hunt matrix
        id: build
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          CONTINUE = "${{ github.event.inputs.continue_label }}".strip()
          TITLE = "${{ github.event.inputs.title }}" or "Research"
          RQ1 = "${{ github.event.inputs.rq1 }}"
          RQ2 = "${{ github.event.inputs.rq2 }}"
          FIELD = "${{ github.event.inputs.field }}"
          # Field choice is "N - Name"; strip the leading index for the planner.
          field_val = FIELD.split(" - ", 1)[-1] if " - " in FIELD else FIELD
          if CONTINUE:
              # Continuation: resume exactly ONE sub-topic. The label and focused
              # title were carried by continue_label as "LABEL|||SUBHUNT_TITLE".
              if "|||" in CONTINUE:
                  label, sub_title = CONTINUE.split("|||", 1)
              else:
                  label, sub_title = CONTINUE, TITLE
              matrix = [{"label": label, "index": "0", "subhunt_title": sub_title}]
              cont_out = label
          else:
              try:
                  out = subprocess.check_output(
                      [sys.executable, "fanout_merge.py", "--matrix",
                       "--title", TITLE, "--rq1", RQ1, "--rq2", RQ2, "--field", field_val],
                      text=True, stderr=subprocess.DEVNULL)
                  matrix = json.loads(out.strip().splitlines()[-1])
              except Exception:
                  matrix = [{"label": "single", "index": "0", "subhunt_title": TITLE}]
              cont_out = ""
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"leg_count={len(matrix)}\n")
              f.write(f"continue_label={cont_out}\n")
          print(f"::notice::Plan matrix: {len(matrix)} sub-hunt(s): "
                f"{[m['label'] for m in matrix]}")
          PY

  daily_learn:
    needs: [verify, research]
    if: always() && github.event_name == 'workflow_dispatch' && (contains(github.event.inputs.operation_mode, 'learn-only') || contains(github.event.inputs.operation_mode, 'full-research'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Ollama models (shared between jobs)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5vl-3b
      - name: Setup Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if [ "${{ steps.cache-ollama.outputs.cache-hit }}" != "true" ]; then
            ollama pull qwen2.5vl:3b
          else
            echo "Model restored from cache"
          fi
      - name: Test model inference
        run: |
          ollama run qwen2.5vl:3b "hello" 2>&1 | head -5
          echo "Ollama READY"
      - name: Restore learning brain (cross-run persistence)
        uses: actions/cache@v4
        with:
          path: scripts/proof_memory.db
          key: proof-memory-${{ github.run_id }}
          restore-keys: proof-memory-
      - name: Restore deep reading knowledge (cross-run persistence)
        uses: actions/cache@v4
        with:
          path: scripts/deep_knowledge.db
          key: deep-knowledge-${{ github.run_id }}
          restore-keys: deep-knowledge-
      - name: Install dependencies
        run: |
          pip install -q requests rich ollama pdfplumber pymupdf
      - name: Show current brain stats
        run: |
          python scripts/daily_learner.py --model qwen2.5vl:3b --stats || echo "No brain data yet"
      - name: Run daily autonomous learning (1 hour deep search + read)
        # Non-fatal: a transient ollama/network error must NOT fail the whole
        # daily_learn job (which would mask the status report below). Capture
        # the outcome so we report it, but keep going.
        continue-on-error: true
        id: learn
        run: |
          echo " Starting daily learning cycle..."
          echo " Date: $(date -u)"
          echo " Topics: ~5 academic fields (rotating daily)"
          echo " Brain: proof_memory.db (accumulates across runs)"
          echo ""
          python scripts/daily_learner.py --model qwen2.5vl:3b --new-only --topics 5
      - name: Show updated brain stats
        if: always()
        run: |
          python scripts/daily_learner.py --model qwen2.5vl:3b --stats || echo "No brain data yet"
      - name: Generate brain report artifact
        if: always()
        run: |
          python scripts/daily_learner.py --model qwen2.5vl:3b --report --report-path brain_report.md || echo "Brain report generation failed"
      - name: Upload brain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-report-daily
          path: brain_report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Deep PDF reading (learn from papers page-by-page)
        # Non-fatal: the deep reader needs PDFs + ollama; without either it
        # should report that, not fail the job.
        continue-on-error: true
        id: deep_read
        run: |
          echo " Starting deep PDF reading..."
          echo " Reading up to 3 papers page-by-page..."
          echo ""
          python scripts/deep_reader.py --model qwen2.5vl:3b --max-papers 3
      - name: Generate deep reading report
        if: always()
        run: |
          python scripts/deep_reader.py --model qwen2.5vl:3b --report --report-path deep_report.md || echo "Deep report generation failed"
      - name: Send daily Telegram notification
        if: always()
        run: |
          python scripts/deep_reader.py --model qwen2.5vl:3b --notify --max-papers 3 || echo "Notification skipped"
      - name: Upload deep reading report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-reading-report-daily
          path: deep_report.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Generate system status & health report
        # This is the "report to us what we might miss" step. Runs the system
        # health entrypoint (run.py) + collects any errors from the learning
        # steps above, so even when the workflow is off we get a snapshot of
        # module health, platform count, transport status, and which learning
        # steps errored. Always runs, even if every learning step failed.
        if: always()
        run: |
          {
            echo "# Daily Learn — System Status Report"
            echo ""
            echo "**Run:** ${{ github.run_id }}  "
            echo "**Date:** $(date -u)  "
            echo "**Learning step:** ${{ steps.learn.outcome }}  "
            echo "**Deep read step:** ${{ steps.deep_read.outcome }}  "
            echo ""
            echo "## System Health (run.py)"
            echo '```'
            python run.py 2>&1 || echo "run.py exited $?"
            echo '```'
            echo ""
            echo "## Brain Stats"
            echo '```'
            python scripts/daily_learner.py --model qwen2.5vl:3b --stats 2>&1 || echo "no brain data"
            echo '```'
            echo ""
            echo "## Deep Reading Stats"
            echo '```'
            python scripts/deep_reader.py --model qwen2.5vl:3b --stats 2>&1 || echo "no deep reading data"
            echo '```'
          } > status_report.md
          cat status_report.md
      - name: Upload status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-learn-status-report
          path: status_report.md
          retention-days: 90


  research:
    needs: [plan]
    if: always() && needs.plan.result == 'success' && github.event_name == 'workflow_dispatch' && (contains(github.event.inputs.operation_mode, 'research-only') || contains(github.event.inputs.operation_mode, 'full-research') || contains(github.event.inputs.operation_mode, 'generate-only'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Matrix: one parallel "research box" per research question / aspect. Each
    # leg runs its own focused sub-hunt, writes to its own per-leg sub-folder
    # (pdf_files/<folder>/<label>), and uploads its own artifact. The merge job
    # later downloads every leg and combines them into one final report/zip.
    # max-parallel is capped to avoid hitting GitHub's concurrent-runner limits.
    strategy:
      matrix:
        config: ${{ fromJson(needs.plan.outputs.matrix) }}
      max-parallel: 5
      fail-fast: false
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_OAUTH_REFRESH: ${{ secrets.GOOGLE_OAUTH_REFRESH }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Ollama models (shared between jobs)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5vl-3b
      - name: Setup Ollama
        run: |
          set -e
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:11434/api/tags > /dev/null 2>&1; then break; fi
            sleep 1
          done
          if [ "${{ steps.cache-ollama.outputs.cache-hit }}" != "true" ]; then
            ollama pull qwen2.5vl:3b
          else
            echo "Model restored from cache"
          fi
      - name: Test model inference
        run: |
          ollama run qwen2.5vl:3b "hello" 2>&1 | head -5
          echo "Ollama READY"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils zip
          pip install -q requests rich openpyxl python-docx python-pptx pdfplumber pymupdf playwright pillow pytesseract reportlab ollama
          python -m playwright install chromium 2>&1 | tail -5
          npm install docx 2>&1 | tail -5
      - name: Determine per-leg output folder
        id: folder
        shell: bash
        run: |
          BASE="${{ needs.plan.outputs.folder_name }}"
          LABEL="${{ matrix.config.label }}"
          echo "folder_name=$BASE" >> $GITHUB_OUTPUT
          echo "leg_label=$LABEL" >> $GITHUB_OUTPUT
          echo "leg_folder=${BASE}/${LABEL}" >> $GITHUB_OUTPUT
          echo "subhunt_title=${{ matrix.config.subhunt_title }}" >> $GITHUB_OUTPUT
          echo "Using base folder: $BASE  |  per-leg folder: ${BASE}/${LABEL}"
      - name: Find previous run (for cross-run artifact download)
        id: prev_run
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/download-artifact@v4 can only download artifacts from the
          # CURRENT run unless we pass run-id. Find the most recent completed
          # run of this workflow (excluding this one) that uploaded THIS LEG's
          # artifact (research-data-<folder>-<label>) so we can resume just this
          # sub-topic. Other legs' artifacts are left untouched.
          #
          # IMPORTANT: chained research runs are almost always 'cancelled'
          # (the 3h job cap kills the long-running search/download step), NOT
          # 'success'. Filtering for conclusion=='success' therefore finds
          # NOTHING and every run starts fresh — the chunk counter resets and
          # the same ~6500 papers are re-searched and lost forever. We must
          # accept 'cancelled' runs too: their `if: always()` upload steps
          # still produced research-data + cache artifacts as long as the
          # python step ran long enough to write them. We verify the run
          # actually has the matching artifact before using it.
          CURRENT_RUN="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          WANT_FOLDER="${{ steps.folder.outputs.folder_name }}"
          WANT_LABEL="${{ steps.folder.outputs.leg_label }}"
          WANT_ARTIFACT="research-data-${WANT_FOLDER}-${WANT_LABEL}"
          echo "Current run: $CURRENT_RUN | want artifact: ${WANT_ARTIFACT}"
          PREV_ID=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/research.yml/runs?per_page=30&status=completed" \
            | python3 -c "
          import json, sys, urllib.request
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              rid = str(r['id'])
              if rid == '$CURRENT_RUN':
                  continue
              # Only resume from runs that actually produced THIS LEG's
              # research-data artifact. cancelled runs still upload artifacts
              # (upload steps are \`if: always()\`), so accept both 'success'
              # and 'cancelled' conclusions.
              if r.get('conclusion') not in ('success', 'cancelled'):
                  continue
              try:
                  url = f\"https://api.github.com/repos/$REPO/actions/runs/{rid}/artifacts?per_page=100\"
                  req = urllib.request.Request(url, headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': 'Bearer $GITHUB_TOKEN',
                  })
                  arts = json.load(urllib.request.urlopen(req, timeout=15)).get('artifacts', [])
              except Exception:
                  continue
              want = '$WANT_ARTIFACT'
              if any(a.get('name') == want and a.get('size_in_bytes', 0) > 0 for a in arts):
                  print(rid)
                  break
          " 2>/dev/null || echo "")
          echo "Previous resumable run: ${PREV_ID:-none}"
          echo "prev_run_id=$PREV_ID" >> "$GITHUB_OUTPUT"
      - name: Download previous research data (this leg, cumulative)
        if: always() && steps.prev_run.outputs.prev_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: research-data-${{ steps.folder.outputs.folder_name }}-${{ steps.folder.outputs.leg_label }}
          path: pdf_files_restore
          run-id: ${{ steps.prev_run.outputs.prev_run_id }}
      - name: Download previous cache (resume support)
        if: always() && steps.prev_run.outputs.prev_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: cache-data-${{ steps.folder.outputs.leg_label }}
          path: download_cache
          run-id: ${{ steps.prev_run.outputs.prev_run_id }}
      - name: Restore cumulative data and cache
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          LEG="${{ steps.folder.outputs.leg_folder }}"
          mkdir -p "pdf_files/${LEG}"
          echo "Restoring previous data and cache for leg: ${LEG}"
          if [ -d "pdf_files_restore" ]; then
            echo "Found previous research data for this leg"
            cp -r pdf_files_restore/. "pdf_files/${LEG}/" 2>/dev/null || true
            rm -rf pdf_files_restore
          else
            echo "No previous research data found - starting fresh"
          fi
          if [ -d "download_cache" ]; then
            cp -f download_cache/*.json "pdf_files/${LEG}/" 2>/dev/null || true
            if [ -d "download_cache/pdf_files" ]; then
              cp -rn download_cache/pdf_files/. "pdf_files/${LEG}/" 2>/dev/null || true
            fi
            rm -rf download_cache
          fi
          echo "All data restored for leg ${LEG}"
          ls -la "pdf_files/${LEG}/" 2>/dev/null | head -20
      - name: Calculate chunk plan
        id: chunk
        shell: bash
        run: |
          LEG="${{ steps.folder.outputs.leg_folder }}"
          FOLDER="pdf_files/${LEG}"
          mkdir -p "$FOLDER"
          STATE_FILE="$FOLDER/chunk_state.json"
          DEPTH="${{ github.event.inputs.research_depth }}"
          DEPTH=$(echo "$DEPTH" | cut -d' ' -f1)
          MODE="${{ github.event.inputs.mode }}"
          MODE=$(echo "$MODE" | cut -d' ' -f1)
          if [ -f "$STATE_FILE" ]; then
            CHUNK=$(python3 -c "import json; d=json.load(open('$STATE_FILE')); print(d.get('chunk', 1))")
            CHUNK=$((CHUNK + 1))
          else
            CHUNK=1
          fi
          # Base chunk count from research_depth (controls chunking aggressiveness)
          case "$DEPTH" in
            light)  BASE=2 ;;
            medium) BASE=4 ;;
            deep)   BASE=8 ;;
            *)      BASE=4 ;;
          esac
          # Mode multiplier — ultra/maximum modes are meant to run for DAYS.
          # Each chunk runs up to 3h, so maximum×deep = 80 chunks ≈ 10 days.
          case "$MODE" in
            sample)   MULT=1 ;;
            simple)   MULT=1 ;;
            quick)    MULT=1 ;;
            field)    MULT=2 ;;
            extended) MULT=3 ;;
            deep)     MULT=4 ;;
            ultra)    MULT=6 ;;
            maximum)  MULT=10 ;;
            *)        MULT=2 ;;
          esac
          ESTIMATED=$(( BASE * MULT ))
          # Hard ceiling so the chain can never loop forever (~8 days max).
          MAX_CHUNKS=64
          if [ "$ESTIMATED" -gt "$MAX_CHUNKS" ]; then
            ESTIMATED=$MAX_CHUNKS
          fi
          echo "{\"chunk\": $CHUNK, \"estimated\": $ESTIMATED, \"depth\": \"$DEPTH\", \"mode\": \"$MODE\", \"max\": $MAX_CHUNKS}" > "$STATE_FILE"
          echo "current_chunk=$CHUNK" >> $GITHUB_OUTPUT
          echo "total_chunks=$ESTIMATED" >> $GITHUB_OUTPUT
          echo "max_chunks=$MAX_CHUNKS" >> $GITHUB_OUTPUT
          echo "depth=$DEPTH" >> $GITHUB_OUTPUT
          HOURS=$(( ESTIMATED * 3 ))
          DAYS=$(( HOURS / 24 ))
          echo "============================================"
          echo "  RESEARCH PLAN"
          echo "  Chunk $CHUNK of ~$ESTIMATED (hard max $MAX_CHUNKS)"
          echo "  Mode: $MODE  |  Depth: $DEPTH"
          echo "  Estimated total: ~${HOURS}h ($DAYS days at 3h/chunk)"
          echo "  Each chunk runs up to 3 hours, then auto-chains to the next"
          echo "============================================"
      - name: Run Research Hunter (cumulative mode)
        env:
          CI_MODE: "true"
          CI_OPERATION_MODE: "${{ github.event.inputs.operation_mode }}"
          CI_TITLE: "${{ steps.folder.outputs.subhunt_title }}"
          CI_RQ1: ""
          CI_RQ2: ""
          CI_FIELD: "${{ github.event.inputs.field }}"
          CI_STUDY_TYPES: "${{ github.event.inputs.study_type }}"
          CI_STUDY_LEVEL: "${{ github.event.inputs.study_level }}"
          CI_METHODOLOGY: "${{ github.event.inputs.methodology }}"
          CI_THESIS_PART: "${{ github.event.inputs.thesis_part }}"
          CI_QUARTILE: "${{ github.event.inputs.quartile }}"
          CI_MODE_VAL: "${{ github.event.inputs.mode }}"
          CI_RESEARCH_DEPTH: "${{ github.event.inputs.research_depth }}"
          CI_FANOUT_MODE: "off"
          CI_PAPER_LIMIT: "${{ github.event.inputs.paper_limit }}"
          CI_LANGUAGE: "${{ github.event.inputs.language }}"
          CI_DOWNLOAD_PDFS: "${{ github.event.inputs.download_pdfs }}"
          CI_SCI_HUB: "${{ github.event.inputs.scihub }}"
          CI_SINGLE_FOLDER: "${{ github.event.inputs.folder_mode }}"
          CI_YEAR_FROM: "${{ github.event.inputs.year_from }}"
          CI_YEAR_TO: "${{ github.event.inputs.year_to }}"
          CI_LEARN: "${{ github.event.inputs.learn }}"
          CI_GENERATE_PAPER: "${{ github.event.inputs.generate_paper }}"
          CI_PAPER_TYPE: "empirical - 📊 Empirical Research (Quantitative)"
          CI_OUTPUT_FORMAT: "${{ github.event.inputs.output_format }}"
          CI_FOLDER_NAME: "${{ steps.folder.outputs.leg_folder }}"
          CI_GEOGRAPHIC_AREA: "${{ github.event.inputs.geographic_area }}"
          CI_PROXY: "${{ github.event.inputs.proxy }}"
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
          PYTHONIOENCODING: utf-8
        run: |
          echo "========================================================"
          echo "  Research Hunter - CUMULATIVE MODE (CI) — matrix leg"
          echo "  Leg:   ${{ steps.folder.outputs.leg_label }}"
          echo "  Title: ${{ steps.folder.outputs.subhunt_title }}"
          echo "  Mode:  ${{ github.event.inputs.mode }}"
          echo "  Depth: ${{ github.event.inputs.research_depth }}"
          echo "  Operation: ${{ github.event.inputs.operation_mode }}"
          echo "========================================================"
          echo ""
          python research_hunter_v2-4.py; echo "EXIT CODE: $?"

      - name: Check results
        id: check_results
        if: always()
        shell: bash
        run: |
          echo "=== Results Summary ==="
          OUT_DIR="pdf_files/${{ steps.folder.outputs.leg_folder }}"
          PDF_COUNT=$(find "$OUT_DIR" -name "*.pdf" 2>/dev/null | wc -l)
          JSON_COUNT=$(find "$OUT_DIR" -name "results.json" 2>/dev/null | wc -l)
          CACHE_COUNT=$(find "$OUT_DIR" -name "*search_cache*.json" 2>/dev/null | wc -l)
          echo "PDFs in leg folder: $PDF_COUNT"
          echo "Results JSON: $JSON_COUNT"
          echo "Search cache: $CACHE_COUNT"
          echo "pdf_count=$PDF_COUNT" >> $GITHUB_OUTPUT
          # Treat as success if REAL progress was made: results.json (search
          # checkpoint) OR downloaded PDFs OR a search_cache that actually FOUND
          # papers. A bare query-only .search_cache.json (written before the
          # search even starts, with queries but 0 papers) must NOT count as
          # success — otherwise every cancelled run that found nothing would
          # re-trigger the chain (cancel-spawns-another loop).
          FOUND_PAPERS=0
          if [ "$CACHE_COUNT" -gt 0 ]; then
            CF=$(find "$OUT_DIR" -name "*search_cache*.json" 2>/dev/null | head -1)
            FOUND_PAPERS=$(python3 -c "import json; d=json.load(open('$CF')); v=d.get('papers_found', d.get('found_count',0)); print(v if isinstance(v,int) else len(v))" 2>/dev/null || echo "0")
          fi
          echo "Papers found in cache: $FOUND_PAPERS"
          if [ "$PDF_COUNT" -gt 0 ] || [ "$JSON_COUNT" -gt 0 ] || [ "$FOUND_PAPERS" -gt 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=no_results" >> $GITHUB_OUTPUT
            echo "No real progress (no results.json, no PDFs, 0 papers found) — NOT re-triggering chain"
          fi

      - name: Generate 40-sheet Excel from results
        if: always() && steps.check_results.outputs.status == 'success'
        shell: bash
        run: |
          OUT_DIR="pdf_files/${{ steps.folder.outputs.leg_folder }}"
          RESULTS="$OUT_DIR/results.json"
          echo "=== Building 40-sheet Excel workbook from real results ==="
          if [ ! -f "$RESULTS" ]; then
            echo "No results.json found — skipping 40-sheet Excel (master_database.xlsx still produced)"
            exit 0
          fi
          python3 generate_ultimate_excel_v10.py "$RESULTS" "$OUT_DIR/ULTIMATE_RESEARCH_SYNTHESIS_V10.xlsx" || {
            echo "⚠️ 40-sheet Excel generation failed — continuing (master xlsx still available)"
            exit 0
          }
          if [ -f "$OUT_DIR/ULTIMATE_RESEARCH_SYNTHESIS_V10.xlsx" ]; then
            SZ=$(stat -c%s "$OUT_DIR/ULTIMATE_RESEARCH_SYNTHESIS_V10.xlsx" 2>/dev/null || stat -f%z "$OUT_DIR/ULTIMATE_RESEARCH_SYNTHESIS_V10.xlsx")
            echo "✅ 40-sheet Excel: ULTIMATE_RESEARCH_SYNTHESIS_V10.xlsx ($SZ bytes)"
          fi

      - name: Convert DOCX report to PDF
        if: always() && steps.check_results.outputs.status == 'success'
        shell: bash
        run: |
          OUT_DIR="pdf_files/${{ steps.folder.outputs.leg_folder }}"
          DOCX="$OUT_DIR/research_report.docx"
          echo "=== Converting research_report.docx → PDF ==="
          if [ ! -f "$DOCX" ]; then
            echo "No research_report.docx found — skipping PDF conversion"
            exit 0
          fi
          if ! command -v soffice >/dev/null 2>&1 && ! command -v libreoffice >/dev/null 2>&1; then
            echo "Installing LibreOffice for PDF conversion..."
            sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer libreoffice-core || true
          fi
          python3 -c "
          import sys
          sys.path.insert(0, '.')
          from report_pdf import docx_to_pdf
          p = docx_to_pdf('$DOCX', timeout=300)
          if p:
              print(f'✅ PDF report: {p.name} ({p.stat().st_size:,} bytes)')
          else:
              print('⚠️ PDF conversion unavailable — DOCX still available')
          " || echo "PDF step errored — continuing (DOCX still available)"

      - name: Zip cumulative results
        id: zip_results
        if: always()
        shell: bash
        run: |
          OUT_DIR="pdf_files/${{ steps.folder.outputs.leg_folder }}"
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          LABEL="${{ steps.folder.outputs.leg_label }}"
          SAFE_TITLE=$(echo "${{ github.event.inputs.title }}" | sed 's/[^a-zA-Z0-9_\-]/_/g' | cut -c1-30)
          ZIP_NAME="${SAFE_TITLE}_${LABEL}.zip"
          echo "Creating per-leg ZIP: $ZIP_NAME"
          if [ -d "$OUT_DIR" ] && [ "$(find "$OUT_DIR" -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip
            zip -r -9 "$ZIP_NAME" "$OUT_DIR"
            echo "ZIP created: $ZIP_NAME ($(du -h "$ZIP_NAME" | cut -f1))"
          else
            echo "No data to zip yet"
            touch "$ZIP_NAME"
          fi
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Report chunk progress
        if: always()
        shell: bash
        run: |
          LEG="${{ steps.folder.outputs.leg_folder }}"
          STATE_FILE="pdf_files/${LEG}/chunk_state.json"
          CACHE_FILE="pdf_files/${LEG}/search_cache.json"
          if [ ! -f "$CACHE_FILE" ]; then
            CACHE_FILE="pdf_files/${LEG}/.search_cache.json"
          fi
          echo "============================================"
          echo "  CHUNK ${{ steps.chunk.outputs.current_chunk }} OF ~${{ steps.chunk.outputs.total_chunks }}"
          echo "  Depth: ${{ steps.chunk.outputs.depth }}"
          if [ -f "$CACHE_FILE" ]; then
            FOUND=$(python3 -c "import json; d=json.load(open('$CACHE_FILE')); print(len(d.get('papers_found',{})))" 2>/dev/null || echo "?")
            DL=$(python3 -c "import json; d=json.load(open('$CACHE_FILE')); print(len(d.get('papers_downloaded',{})))" 2>/dev/null || echo "?")
            echo "  Papers found: $FOUND  |  Downloaded: $DL"
          fi
          echo "============================================"

      - name: Auto-trigger next run (chain continuation)
        # Fire whenever progress was made, even if the 3h timeout cancelled
        # the python step mid-download. The step body guards against triggering
        # when no work remains (.search_complete / exhausted / max_chunks).
        #
        # KILL SWITCH: vars.STOP_RESEARCH_CHAIN == 'true' (a repo variable you
        # can set any time with:  gh variable set STOP_RESEARCH_CHAIN true
        # and clear with:          gh variable delete STOP_RESEARCH_CHAIN).
        # The `if:` catches a variable set BEFORE this run was dispatched; the
        # in-body API check catches a variable set DURING the run (e.g. while a
        # runaway chain is mid-flight), so cancelling a run no longer spawns the
        # next one. This is the only reliable way to stop a self-perpetuating
        # chain — GitHub cancel just lets `if: always()` run and re-dispatch.
        if: always() && steps.check_results.outputs.status == 'success' && vars.STOP_RESEARCH_CHAIN != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          # Chain continuation always dispatches on the repo default branch (main)
          # so chained runs use the latest code, not a stale feature branch.
          TRIGGER_BRANCH: main
          TRIGGER_TITLE: ${{ github.event.inputs.title }}
          TRIGGER_RQ1: ${{ github.event.inputs.rq1 }}
          TRIGGER_RQ2: ${{ github.event.inputs.rq2 }}
          TRIGGER_FIELD: ${{ github.event.inputs.field }}
          TRIGGER_STUDY_TYPE: ${{ github.event.inputs.study_type }}
          TRIGGER_STUDY_LEVEL: ${{ github.event.inputs.study_level }}
          TRIGGER_METHODOLOGY: ${{ github.event.inputs.methodology }}
          TRIGGER_THESIS_PART: ${{ github.event.inputs.thesis_part }}
          TRIGGER_QUARTILE: ${{ github.event.inputs.quartile }}
          TRIGGER_LANGUAGE: ${{ github.event.inputs.language }}
          TRIGGER_YEAR_FROM: ${{ github.event.inputs.year_from }}
          TRIGGER_YEAR_TO: ${{ github.event.inputs.year_to }}
          TRIGGER_MODE: ${{ github.event.inputs.mode }}
          TRIGGER_FANOUT_MODE: ${{ github.event.inputs.fanout_mode }}
          TRIGGER_PAPER_LIMIT: ${{ github.event.inputs.paper_limit }}
          TRIGGER_FOLDER_MODE: ${{ github.event.inputs.folder_mode }}
          TRIGGER_DOWNLOAD_PDFS: ${{ github.event.inputs.download_pdfs }}
          TRIGGER_SCIHUB: ${{ github.event.inputs.scihub }}
          TRIGGER_PROXY: ${{ github.event.inputs.proxy }}
          TRIGGER_LEARN: ${{ github.event.inputs.learn }}
          TRIGGER_GENERATE_PAPER: ${{ github.event.inputs.generate_paper }}
          TRIGGER_OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          TRIGGER_GEOGRAPHIC_AREA: ${{ github.event.inputs.geographic_area }}
          TRIGGER_RESEARCH_DEPTH: ${{ github.event.inputs.research_depth }}
          TRIGGER_OPERATION_MODE: ${{ github.event.inputs.operation_mode }}
          # Single-leg continuation: the next run's plan job sees continue_label
          # and emits a one-leg matrix for JUST this sub-topic, so completed legs
          # are never re-run. Encoded as "LABEL|||SUBHUNT_TITLE".
          TRIGGER_CONTINUE_LABEL: ${{ steps.folder.outputs.leg_label }}|||${{ steps.folder.outputs.subhunt_title }}
        shell: bash
        run: |
          echo "Checking if more work remains for this leg..."
          OUT_DIR="pdf_files/${{ steps.folder.outputs.leg_folder }}"
          CURRENT_CHUNK=${{ steps.chunk.outputs.current_chunk }}
          MAX_CHUNKS=${{ steps.chunk.outputs.max_chunks }}

          # KILL SWITCH (runtime check): honor STOP_RESEARCH_CHAIN even if it was
          # set AFTER this run started. The `if:` above only catches a variable
          # set before dispatch; this API check catches a mid-run kill signal so
          # a runaway chain can be stopped without spawning the next run.
          STOP_NOW=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/variables/STOP_RESEARCH_CHAIN" \
            2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('value',''))" 2>/dev/null || echo "")
          if [ "$STOP_NOW" = "true" ]; then
            echo "============================================"
            echo "  🛑 STOP_RESEARCH_CHAIN == true — chain stopped by operator"
            echo "  To resume: gh variable delete STOP_RESEARCH_CHAIN"
            echo "============================================"
            exit 0
          fi

          # Stop condition 1: the python wrote .search_complete (exhausted or no papers)
          if [ -f "$OUT_DIR/.search_complete" ]; then
            REASON=$(cat "$OUT_DIR/.search_complete" 2>/dev/null || echo "done")
            echo "============================================"
            echo "  SEARCH COMPLETE FLAG FOUND — stopping chain"
            echo "  Reason: $REASON"
            echo "============================================"
            exit 0
          fi

          # Stop condition 2: hard chunk cap reached (safety net — never loop forever)
          if [ -n "$MAX_CHUNKS" ] && [ "$CURRENT_CHUNK" -ge "$MAX_CHUNKS" ]; then
            echo "============================================"
            echo "  HARD CHUNK CAP REACHED ($CURRENT_CHUNK/$MAX_CHUNKS) — stopping chain"
            echo "  The search ran for ~$(( MAX_CHUNKS * 3 ))h. Final output is in this run's artifacts."
            echo "============================================"
            exit 0
          fi

          echo "Chunk $CURRENT_CHUNK of ~${{ steps.chunk.outputs.total_chunks }} (max $MAX_CHUNKS) — continuing chain"
          CACHE_FILE="$OUT_DIR/search_cache.json"
          if [ ! -f "$CACHE_FILE" ]; then
            CACHE_FILE="$OUT_DIR/.search_cache.json"
          fi
          if [ ! -f "$CACHE_FILE" ]; then
            echo "No cache file found - cannot determine remaining work"
            exit 0
          fi
          # Read cache state. search_cache.py writes these as ints/bools:
          #   papers_found (int), papers_downloaded (int), queries_exhausted (bool)
          TOTAL_FOUND=$(python3 -c "import json; d=json.load(open('$CACHE_FILE')); v=d.get('papers_found', d.get('found_count',0)); print(v if isinstance(v,int) else len(v))" 2>/dev/null || echo "0")
          TOTAL_DL=$(python3 -c "import json; d=json.load(open('$CACHE_FILE')); v=d.get('papers_downloaded', d.get('downloaded_count',0)); print(v if isinstance(v,int) else len(v))" 2>/dev/null || echo "0")
          EXHAUSTED=$(python3 -c "import json; d=json.load(open('$CACHE_FILE')); print(str(d.get('queries_exhausted', False)))" 2>/dev/null || echo "False")
          echo "Progress: $TOTAL_DL downloaded / $TOTAL_FOUND found / exhausted=$EXHAUSTED"
          if [ "$EXHAUSTED" = "True" ]; then
            echo "============================================"
            echo "  ALL RESEARCH COMPLETE — queries exhausted!"
            echo "  Chunk $CURRENT_CHUNK of ~${{ steps.chunk.outputs.total_chunks }}"
            echo "  Total papers found: $TOTAL_FOUND"
            echo "  Total downloaded: $TOTAL_DL"
            echo "============================================"
            exit 0
          fi
          REMAINING=$(( (TOTAL_FOUND - TOTAL_DL + 49) / 50 ))
          if [ "$REMAINING" -le 0 ] && [ "$TOTAL_FOUND" -gt 0 ]; then
            echo "All found papers downloaded - no download work remaining"
          fi
          echo "Approximately $REMAINING download batches remaining — triggering next chunk"
          echo "Triggering next run via GitHub API..."
          python3 -c "import json, os; payload = {'ref': os.environ.get('TRIGGER_BRANCH', os.environ.get('GITHUB_REF_NAME', 'main')), 'inputs': {}}; [payload['inputs'].update({k.replace('TRIGGER_', '').lower(): v}) for k, v in os.environ.items() if k.startswith('TRIGGER_') and k != 'TRIGGER_BRANCH']; open('/tmp/payload.json', 'w').write(json.dumps(payload)); print('=== PAYLOAD (all inputs preserved) ==='); print(json.dumps(payload, indent=2)); print('======================================')"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/research.yml/dispatches" \
            -d @/tmp/payload.json \
            -w "\nHTTP Status: %{http_code}"
          echo ""
          echo "Next run triggered!"
          echo "https://github.com/${{ github.repository }}/actions"

      - name: Upload per-leg research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-data-${{ steps.folder.outputs.folder_name }}-${{ steps.folder.outputs.leg_label }}
          path: pdf_files/${{ steps.folder.outputs.leg_folder }}
          retention-days: 90
          compression-level: 1
          overwrite: true

      - name: Upload per-leg ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.folder.outputs.folder_name }}_ZIP_${{ steps.folder.outputs.leg_label }}
          path: ${{ steps.zip_results.outputs.zip_name || '*.zip' }}
          retention-days: 90
          compression-level: 9
          overwrite: true

      - name: Upload cache/logs for this leg (for resume capability)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cache-data-${{ steps.folder.outputs.leg_label }}
          path: |
            pdf_files/${{ steps.folder.outputs.leg_folder }}/.search_cache.json
            pdf_files/${{ steps.folder.outputs.leg_folder }}/search_cache.json
            .search_cache.json
            search_cache.json
            ghost_credentials.json
            g4f_locked_config.json
          retention-days: 30
          overwrite: true

  # ═══════════════════════════════════════════════════════════════════════════
  # MERGE JOB — combines every parallel "research box" into ONE final report.
  # Runs after ALL research matrix legs finish. Downloads every per-leg
  # research-data-<folder>-<label> artifact (from this run AND, for legs that
  # chained across runs, from the most recent previous run), merges them with
  # fanout_merge.merge_reports (dedup by DOI→title→URL), generates the unified
  # DOCX + Excel + PDF, and zips everything into one final .zip.
  #
  # Runs whenever there were ≥2 research legs (a real split) OR fanout_mode is
  # explicitly on, so a single-leg run skips the redundant merge.
  # ═══════════════════════════════════════════════════════════════════════════
  merge:
    needs: [plan, research]
    if: always() && needs.plan.result == 'success' && github.event_name == 'workflow_dispatch' && (startsWith(github.event.inputs.fanout_mode, 'on') || needs.plan.outputs.leg_count != '1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies + zip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip
          pip install -q requests rich openpyxl python-docx pdfplumber pymupdf pillow reportlab
          if ! command -v soffice >/dev/null 2>&1 && ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get install -y -qq libreoffice-writer libreoffice-core || true
          fi

      - name: Determine output folder
        id: folder
        shell: bash
        run: |
          echo "folder_name=${{ needs.plan.outputs.folder_name }}" >> "$GITHUB_OUTPUT"
          echo "leg_count=${{ needs.plan.outputs.leg_count }}" >> "$GITHUB_OUTPUT"

      - name: Download ALL per-leg research data (current run)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: research-data-${{ needs.plan.outputs.folder_name }}-*
          path: legs_current
          merge-multiple: true

      - name: Download missing per-leg data cross-run (legs that chained)
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A matrix leg that timed out dispatches a single-leg continuation run.
          # Its per-leg artifact lives in THAT run, not this one. Download every
          # research-data-<folder>-* artifact from the most recent previous
          # completed run (cancelled runs upload too) so the merge has the
          # latest copy of every leg. We only fetch labels we don't already have.
          BASE="${{ needs.plan.outputs.folder_name }}"
          REPO="${{ github.repository }}"
          CURRENT="${{ github.run_id }}"
          mkdir -p legs_prev
          PREV_ID=$(curl -s \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/research.yml/runs?per_page=40&status=completed" \
            | python3 -c "
          import json, sys, urllib.request
          base = '$BASE'
          runs = json.load(sys.stdin).get('workflow_runs', [])
          for r in runs:
              rid = str(r['id'])
              if rid == '$CURRENT' or r.get('conclusion') not in ('success','cancelled'):
                  continue
              try:
                  url = f\"https://api.github.com/repos/$REPO/actions/runs/{rid}/artifacts?per_page=100\"
                  req = urllib.request.Request(url, headers={'Accept':'application/vnd.github+json','Authorization':'Bearer $GITHUB_TOKEN'})
                  arts = json.load(urllib.request.urlopen(req, timeout=15)).get('artifacts', [])
              except Exception:
                  continue
              if any(a.get('name','').startswith(f'research-data-{base}-') and a.get('size_in_bytes',0)>0 for a in arts):
                  print(rid); break
          " 2>/dev/null || echo "")
          if [ -z "$PREV_ID" ]; then echo "No previous run with leg artifacts"; exit 0; fi
          echo "Previous run with leg artifacts: $PREV_ID"
          # List this run's artifacts and pull only the missing labels cross-run.
          HAVE=$(ls -d legs_current/*/ 2>/dev/null | xargs -n1 basename 2>/dev/null | tr '\n' ' ')
          echo "Already have legs: ${HAVE:-none}"
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/runs/$PREV_ID/artifacts?per_page=100" \
            | python3 -c "
          import json, sys, os, urllib.request
          base='$BASE'; have=set('${HAVE}'.split())
          arts=json.load(sys.stdin).get('artifacts',[])
          for a in arts:
              name=a.get('name','')
              if not name.startswith(f'research-data-{base}-'): continue
              label=name.split(f'research-data-{base}-',1)[1]
              if label in have: continue
              url=a.get('archive_download_url')
              if not url: continue
              req=urllib.request.Request(url, headers={'Authorization':'Bearer $GITHUB_TOKEN','Accept':'application/vnd.github+json'})
              data=urllib.request.urlopen(req, timeout=60).read()
              import zipfile, io
              os.makedirs(f'legs_prev/{label}', exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(data)) as z: z.extractall(f'legs_prev/{label}')
              print(f'  cross-run leg {label}: {a.get(\"size_in_bytes\",0)} bytes')
          " 2>/dev/null || echo "cross-run download step had an error (non-fatal)"

      - name: Assemble + merge all legs into one unified report
        id: merge
        env:
          PYTHONIOENCODING: utf-8
          BASE: ${{ needs.plan.outputs.folder_name }}
          TITLE: ${{ github.event.inputs.title }}
        shell: bash
        run: |
          BASE="${{ needs.plan.outputs.folder_name }}"
          echo "========================================================"
          echo "  MERGE: combining all research legs → unified report"
          echo "  Title: ${{ github.event.inputs.title }}"
          echo "  Legs planned: ${{ needs.plan.outputs.leg_count }}"
          echo "========================================================"
          python3 - <<'PY'
          import json, os, sys, shutil
          from pathlib import Path
          import fanout_merge as fm
          import research_hunter_v2_4 as v
          from report_pdf import docx_to_pdf

          base = os.environ.get("BASE", "")
          out = Path("pdf_files") / base
          out.mkdir(parents=True, exist_ok=True)

          # Collect every leg's results.json from both legs_current and legs_prev.
          # Artifacts are uploaded with path pdf_files/<base>/<label>, so after
          # merge-multiple download the structure is <root>/pdf_files/<base>/<label>/results.json.
          # We rglob every results.json so no leg is missed.
          reports = []
          legs_seen = set()
          for root in ("legs_current", "legs_prev"):
              rd = Path(root)
              if not rd.exists():
                  continue
              for rj in sorted(rd.rglob("results.json")):
                  if str(rj) in legs_seen:
                      continue
                  legs_seen.add(str(rj))
                  try:
                      d = json.loads(rj.read_text())
                      if d.get("papers") or d.get("run_stats"):
                          reports.append(d)
                          print(f"  + {rj}: {len(d.get('papers', []))} papers")
                  except Exception as e:
                      print(f"  ! {rj} unreadable: {e}")

          print(f"Collected {len(reports)} leg report(s).")
          if not reports:
              print("No leg results found — nothing to merge.")
              (out / "MERGE_EMPTY.txt").write_text("No leg results were available to merge.\n")
              sys.exit(0)

          merged = fm.merge_reports(reports,
                                    unified_title=os.environ.get("TITLE", base),
                                    unified_field=reports[0].get("field", "general"))
          (out / "results.json").write_text(json.dumps(merged, ensure_ascii=False, indent=2))
          print(f"Merged: {len(merged.get('papers',[]))} unique papers, "
                f"{merged.get('run_stats',{}).get('duplicates_removed',0)} duplicates removed")

          docx_path = v.generate_docx_report(merged, out)
          print(f"DOCX: {docx_path}")
          if docx_path:
              xlsx = v._write_master_xlsx(merged.get('papers', []), out,
                                          queries_used=merged.get('ai_queries', []))
              print(f"Excel: {xlsx}")
              try:
                  pdf = docx_to_pdf(docx_path, timeout=300)
                  print(f"PDF: {pdf}")
              except Exception as e:
                  print(f"PDF conversion failed: {e}")
          print("✅ Unified report generated")
          PY

      - name: Create final unified ZIP
        if: always()
        shell: bash
        run: |
          BASE="${{ needs.plan.outputs.folder_name }}"
          SAFE_TITLE=$(echo "${{ github.event.inputs.title }}" | sed 's/[^a-zA-Z0-9_\-]/_/g' | cut -c1-30)
          FINAL="${SAFE_TITLE}_FINAL_UNIFIED.zip"
          OUT="pdf_files/${BASE}"
          if [ -d "$OUT" ] && [ "$(find "$OUT" -type f 2>/dev/null | wc -l)" -gt 0 ]; then
            zip -r -9 "$FINAL" "$OUT" >/dev/null 2>&1
            echo "Final ZIP: $FINAL ($(du -h "$FINAL" | cut -f1))"
          else
            echo "No unified data to zip"
            touch "$FINAL"
          fi
          echo "final_zip=$FINAL" >> "$GITHUB_OUTPUT"

      - name: Upload merged report (DOCX/PDF/Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-report-${{ needs.plan.outputs.folder_name }}
          path: |
            pdf_files/${{ needs.plan.outputs.folder_name }}/research_report.docx
            pdf_files/${{ needs.plan.outputs.folder_name }}/research_report.pdf
            pdf_files/${{ needs.plan.outputs.folder_name }}/master_papers.xlsx
            pdf_files/${{ needs.plan.outputs.folder_name }}/results.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload final unified ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.folder_name }}_FINAL_UNIFIED
          path: ${{ steps.merge.outputs.final_zip || '*_FINAL_UNIFIED.zip' }}
          if-no-files-found: ignore
          retention-days: 90


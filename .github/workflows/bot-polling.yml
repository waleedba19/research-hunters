name: Bot Polling

# NOTE: The Telegram bot layer (telegram_bot.py, telegram_ui.py) was removed
# from this repository. This workflow is preserved for reference so it can be
# re-enabled once the bot module is restored. It will exit immediately until
# then. The core research engine (research_hunter_v2-4, hunt_pipeline,
# verify_refs) does NOT depend on Telegram and works standalone.

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: bot-polling
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bot availability
        run: |
          echo "The Telegram bot layer (telegram_bot.py) has been removed from this repo."
          echo "This workflow is preserved for when the bot module is restored."
          echo "The core research engine works standalone — see research.yml / test.yml."
          exit 0

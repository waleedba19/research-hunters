name: CI

# Fast, deterministic checks that run automatically on every PR and push.
# No ollama and no network-dependent smoke tests (those live in test.yml,
# which is workflow_dispatch). Everything here must pass offline.

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax check all .py files (warnings are errors)
        run: python3 -W error::SyntaxWarning -m compileall -q .

      - name: Import smoke test (full module surface)
        run: |
          python3 -c "import logger, error_handler, state_manager, wizard, scoring_prompts, pdf_parser, metadata_extractor, platform_registry, google_integration, precision_engine, research_hunter_v4, hunt_intake, hunt_pipeline, future_studies, report_pdf, chapter_writer, deep_reader, synthesis_engine, fanout_merge, verify_refs, verify_refs.orchestrator, verify_refs.reports, verify_refs.input_parser" && echo "ALL IMPORTS OK"

      - name: "Unit test: state_manager"
        run: |
          python3 -c "
          from state_manager import save_chapter_state, load_chapter_state, clear_chapter_state
          save_chapter_state(99999, {'foo': 'bar'})
          s = load_chapter_state(99999)
          assert s and s.get('foo') == 'bar', s
          clear_chapter_state(99999)
          assert load_chapter_state(99999) is None
          print('state_manager OK')
          "

      - name: "Unit test: wizard (input state machine, no Telegram)"
        run: |
          python3 -c "
          from wizard import RESEARCH_TYPES, start_wizard, get_current_step, is_wizard_active
          assert len(RESEARCH_TYPES) >= 11, 'expected >= 11 research types'
          start_wizard(77777)
          assert is_wizard_active(77777)
          step = get_current_step({})
          assert step is not None
          print('wizard OK (%d research types)' % len(RESEARCH_TYPES))
          "

      - name: "Unit test: pdf_parser"
        run: |
          python3 -c "
          from pdf_parser import parse_chapter_references, extract_text
          txt = 'Some text (Smith, 2020, p. 12) about stuff. More (Jones et al., 2021).\n\nReferences\n\n1. Smith, J. (2020). Deep learning. Journal of AI, 5(2), 1-10.\n2. Jones, A. et al. (2021). Neural networks. Nature, 100, 200-210.\n'
          import tempfile, os
          f = tempfile.NamedTemporaryFile(suffix='.txt', delete=False, mode='w')
          f.write(txt); f.close()
          r = parse_chapter_references(f.name)
          assert len(r['in_text_citations']) >= 1, r
          assert len(r['reference_list']) >= 1, r
          os.unlink(f.name)
          print('pdf_parser OK')
          "

      - name: "Unit test: verify_refs (parser + reports, no e2e)"
        run: python3 tests/test_verify_refs.py --no-e2e

      - name: "Unit test: deep_reader (section detection + cleanup, no PDFs)"
        run: python3 tests/test_deep_reader.py

      - name: "Unit test: synthesis_engine (6 analytical passes, no network)"
        run: python3 tests/test_synthesis_engine.py

      - name: "Unit test: hunt_intake (state machine, no Telegram)"
        run: python3 tests/test_hunt_intake.py

      - name: "Unit test: fanout_merge (dedup, stat aggregation, no network)"
        run: python3 tests/test_fanout_merge.py

      - name: "Unit test: google_integration (API surface, no creds needed)"
        run: |
          python3 -c "
          import google_integration as gdrive
          # Public API surface must be intact regardless of creds
          for fn in ('create_drive_folder','upload_to_drive','upload_results_to_drive','create_doi_sheet','list_files_in_folder'):
              assert hasattr(gdrive, fn), 'missing: ' + fn
          print('google_integration OK (API surface intact)')
          "

      - name: "Unit test: report_pdf"
        run: python3 tests/test_report_pdf.py

      - name: "Unit test: future_studies (mocked ollama)"
        run: python3 tests/test_future_studies.py

      - name: "Generate sample reports (fixed dataset, no ollama)"
        run: python3 tests/generate_sample_reports.py

      - name: "Test Excel generation system (v10.0)"
        run: python3 generate_ultimate_excel_v10.py

      - name: "Health check: platforms, helpers, structure, verify_refs"
        run: python3 tests/test_health.py
